[tool.poetry]
name = "poetry-app"
version = "0.1.0"
description = "A fixture Poetry project."

[tool.poetry.dependencies]
python = "^3.11"
Django = "^5.0"  # case differs from the framework list
"SQLAlchemy" = { version = "^2.0", extras = ["asyncio"] }
