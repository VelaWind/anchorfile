name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: typecheck · test · pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck (source and tests)
        run: npm run typecheck
      - name: Test (builds dist/ first, then runs the CLI against fixtures)
        run: npm test
      - name: Package contents
        run: npm pack --dry-run
